[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-builder"
description = "OS Builder — build your own Ubuntu based operating system (rewrite of Ubuntu Builder)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "PyQt6>=6.6",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
os-builder-cli = "os_builder.cli:main"

[project.gui-scripts]
os-builder = "os_builder.app:main"

[tool.setuptools.dynamic]
version = { attr = "os_builder.__version__" }

[tool.setuptools.packages.find]
where = ["src/os-builder"]
include = ["os_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/os-builder"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105", "SIM108"]  # explicit try/except and if/else read better here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # HTML fixtures mirror the upstream markup
